[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-cli"
description = "CLI and MCP server for managing Super Productivity via its WebDAV sync file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]
dynamic = ["version"]
authors = [{ name = "Pavel Donin" }]
keywords = ["super-productivity", "cli", "mcp", "webdav", "tasks", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/prineycom/sp-cli"
Issues = "https://github.com/prineycom/sp-cli/issues"

[project.scripts]
sp = "sp_cli.cli:main"
sp-mcp = "sp_cli.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sp_cli"]

[tool.setuptools.dynamic]
version = { attr = "sp_cli.__version__" }
